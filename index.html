            userBadge.style.display = 'flex';
            userNameDisplay.textContent = currentUser.username;
            // 设置角色徽章
            const roleMap = { owner: '宗主', admin: '长老', member: '弟子' };
            const roleName = roleMap[currentUser.role] || '访客';
            userRoleBadge.textContent = roleName;
            userRoleBadge.className = 'role-badge ' + currentUser.role;
            // 状态光点颜色随角色变化
            userDot.className = 'dot';
            if (currentUser.role === 'owner') userDot.style.background = '#ff8c7a';
            else if (currentUser.role === 'admin') userDot.style.background = '#f0d078';
            else userDot.style.background = '#7ec8a0';
            btnChangePwd.style.display = 'inline-flex';
        } else {
            btnLogin.style.display = 'inline-flex';
            btnLogout.style.display = 'none';
            userBadge.style.display = 'none';
            btnChangePwd.style.display = 'none';
            keyLevelSelect.value = 'none';
        }
        updateKeyLevelUI();
    }

    async function checkLoginStatus() {
        try {
            const res = await fetch(API_BASE + '/api/me', { credentials: 'include' });
            if (res.ok) {
                const data = await res.json();
                if (data && data.username) {
                    currentUser = data;  // 包含 role 字段
                } else {
                    currentUser = null;
                }
            } else {
                currentUser = null;
            }
        } catch (e) {
            currentUser = null;
        } finally {
            updateLoginUI();
        }
    }

    // ... 其他函数（加密/解密/UI交互等）与原代码完全一致 ...
    // 注意：在 encrypt 和 decrypt 函数中已包含对 currentUser 的检查，无需修改
    // 只需确保登录/登出后调用 updateLoginUI 即可

    // 初始化
    checkLoginStatus();
    // ... 其余初始化事件绑定保持不变 ...
})();
</script>
</body>
</html>
